<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Virtual Interview Practice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-layer"></div>

    <!-- Site Header -->
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="site-title-link">
                <h1 class="site-title">Virtual Interview Practice</h1>
            </a>
            <p class="site-tagline">Master HTML, CSS & JavaScript — Practice technical interviews</p>
        </div>
    </header>
    
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Login</h2>
            <p class="auth-subtitle">Welcome back! Sign in to continue.</p>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                </div>
                <p class="auth-error hidden" id="loginError"></p>
                <button type="submit" class="btn btn-primary btn-auth">Login</button>
            </form>
            
            <p class="auth-switch">
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </div>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <p class="footer-text">Practice makes perfect. Keep sharpening your skills!</p>
            <p class="footer-copyright">&copy; 2025 Virtual Interview Practice. All rights reserved.</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            
            if (Auth.login(email, password)) {
                window.location.href = 'index.html';
            } else {
                errorEl.textContent = 'Invalid email or password.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
